# Simulador web de Batalla Naval
server.port=8080
spring.application.name=battleship-simulador

# Skill de Alexa (la misma que usa deploy/skill.sh)
simulador.skill-id=amzn1.ask.skill.fe055462-2886-4526-9e85-44dd8cb8c5d4
simulador.locale=es-US

# Modo "Lambda en AWS"
simulador.aws-region=us-east-1
simulador.lambda-function=battleship-alexa:live

# Robot virtual en AWS IoT: los certificados que crea deploy/deploy.sh
simulador.robot-certs=../deploy/ev3-certs
