<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48">
  <!-- Marca de impacto como en el juego real: dos ladrillos redondos blancos con llamas LEGO encima -->
  <style>
    .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker .9s ease-in-out infinite alternate; }
    .f2 { animation-duration: 1.1s; animation-delay: -.4s; }
    .core { animation: glow .6s ease-in-out infinite alternate; }
    @keyframes flicker {
      0% { transform: scale(1, 1) skewX(0deg); }
      35% { transform: scale(.94, 1.08) skewX(-4deg); }
      70% { transform: scale(1.04, .95) skewX(3deg); }
      100% { transform: scale(.97, 1.1) skewX(-2deg); }
    }
    @keyframes glow { from { opacity: .65; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flame, .core { animation: none; } }
  </style>
  <defs>
    <linearGradient id="fuego" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff6a00" stop-opacity=".95"/>
      <stop offset=".6" stop-color="#ff9a1f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffc24a" stop-opacity=".75"/>
    </linearGradient>
    <linearGradient id="blanco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9dde3"/>
      <stop offset=".35" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9bfc8"/>
    </linearGradient>
    <!-- Llama con lenguas, parecida a la pieza LEGO de fuego -->
    <symbol id="llama" viewBox="-8 0 16 31" overflow="visible">
      <path fill="url(#fuego)" stroke="#d94f00" stroke-width=".6" stroke-linejoin="round"
            d="M0 31 C-4 28 -7 23 -5 16 C-4 19 -3 20 -2 20 C-4 14 -3 8 0 2 C0 8 2 11 3 13 C4 11 4 9 4 6 C8 12 7 20 4 25 C3 28 2 30 0 31 Z"/>
      <path class="core" fill="#fff3a8" d="M0 30 C-2 27 -3 24 -1 19 C0 22 1 22 2 21 C3 25 2 28 0 30 Z"/>
    </symbol>
  </defs>

  <!-- Ladrillos redondos 1x1 -->
  <g>
    <rect x="5" y="31" width="13" height="14" rx="2" fill="url(#blanco)" stroke="#8d949e" stroke-width=".8"/>
    <ellipse cx="11.5" cy="31" rx="6.5" ry="2.2" fill="#ffffff" stroke="#8d949e" stroke-width=".8"/>
    <rect x="22" y="31" width="13" height="14" rx="2" fill="url(#blanco)" stroke="#8d949e" stroke-width=".8"/>
    <ellipse cx="28.5" cy="31" rx="6.5" ry="2.2" fill="#ffffff" stroke="#8d949e" stroke-width=".8"/>
  </g>

  <!-- Llamas -->
  <g class="flame"><use href="#llama" x="3.5" y="1" width="16" height="31"/></g>
  <g class="flame f2"><use href="#llama" x="20.5" y="0" width="16" height="32"/></g>
</svg>
