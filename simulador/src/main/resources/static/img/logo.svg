<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" role="img" aria-label="Batalla Naval">
  <!-- Logotipo original del simulador Batalla Naval: emblema naval con ancla, mira y bloques -->
  <defs>
    <radialGradient id="sea" cx="50%" cy="35%" r="70%">
      <stop offset="0" stop-color="#3a8be0"/>
      <stop offset="1" stop-color="#0b2f63"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".5" stop-color="#f2b62c"/>
      <stop offset="1" stop-color="#b8780f"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2433a"/>
      <stop offset="1" stop-color="#9b1c16"/>
    </linearGradient>
  </defs>

  <!-- Aro exterior con remaches -->
  <circle cx="120" cy="108" r="96" fill="url(#gold)"/>
  <circle cx="120" cy="108" r="86" fill="url(#sea)" stroke="#0b1d33" stroke-width="3"/>
  <g fill="#8a5a0a">
    <circle cx="120" cy="17" r="3.5"/><circle cx="211" cy="108" r="3.5"/><circle cx="29" cy="108" r="3.5"/>
    <circle cx="184" cy="44" r="3.5"/><circle cx="56" cy="44" r="3.5"/><circle cx="184" cy="172" r="3.5"/><circle cx="56" cy="172" r="3.5"/>
  </g>

  <!-- Tablero 3x3 de bloques con studs -->
  <g transform="translate(78 38)">
    <g fill="#1f6fd1" stroke="#0b2f63" stroke-width="2">
      <rect x="0" y="0" width="26" height="26" rx="4"/><rect x="29" y="0" width="26" height="26" rx="4"/><rect x="58" y="0" width="26" height="26" rx="4"/>
      <rect x="0" y="29" width="26" height="26" rx="4"/><rect x="58" y="29" width="26" height="26" rx="4"/>
      <rect x="0" y="58" width="26" height="26" rx="4"/><rect x="29" y="58" width="26" height="26" rx="4"/><rect x="58" y="58" width="26" height="26" rx="4"/>
    </g>
    <rect x="29" y="29" width="26" height="26" rx="4" fill="#e2433a" stroke="#7a1410" stroke-width="2"/>
    <g fill="#ffffff44">
      <circle cx="13" cy="13" r="6"/><circle cx="42" cy="13" r="6"/><circle cx="71" cy="13" r="6"/>
      <circle cx="13" cy="42" r="6"/><circle cx="71" cy="42" r="6"/>
      <circle cx="13" cy="71" r="6"/><circle cx="42" cy="71" r="6"/><circle cx="71" cy="71" r="6"/>
    </g>
    <circle cx="42" cy="42" r="6" fill="#ffffff66"/>
  </g>

  <!-- Mira sobre el bloque rojo -->
  <g stroke="#ffe08a" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(0 -14)">
    <circle cx="120" cy="94" r="24"/>
    <line x1="120" y1="62" x2="120" y2="76"/><line x1="120" y1="112" x2="120" y2="126"/>
    <line x1="88" y1="94" x2="102" y2="94"/><line x1="138" y1="94" x2="152" y2="94"/>
  </g>

  <!-- Ancla -->
  <g transform="translate(0 -12)">
  <g fill="none" stroke="#f2b62c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 140 V178"/>
    <path d="M96 166 Q120 192 144 166"/>
    <path d="M108 146 H132"/>
  </g>
  <circle cx="120" cy="136" r="6" fill="none" stroke="#f2b62c" stroke-width="4"/>
  </g>

  <!-- Cinta con el nombre -->
  <g transform="translate(0 24)">
  <path d="M14 178 L40 170 L40 208 L14 214 L24 196 Z" fill="#7a1410"/>
  <path d="M226 178 L200 170 L200 208 L226 214 L216 196 Z" fill="#7a1410"/>
  <path d="M34 168 Q120 152 206 168 L206 206 Q120 190 34 206 Z" fill="url(#ribbon)" stroke="#5b0f0c" stroke-width="2"/>
  <text x="120" y="194" text-anchor="middle" font-family="Impact, 'Arial Black', 'Helvetica Neue', sans-serif"
        font-size="25" letter-spacing="2" fill="#fff3d6" stroke="#5b0f0c" stroke-width="1">BATALLA NAVAL</text>
  </g>
</svg>
